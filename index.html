<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="Budgetblick – Fixkosten, Verträge und Ausgaben im Blick. Alle Daten bleiben auf dem Gerät."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Budgetblick" />
    <title>Budgetblick</title>
    <script>
      // Farbschema vor dem ersten Rendern setzen (verhindert Aufblitzen).
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('budgetblick-theme') || 'system';
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
